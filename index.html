<!--
  Flightdeck — programs / projects, Kanban board, Mon-Fri week planner,
  schedulable steps, recurring tasks, and roll-forward.
  Self-contained HTML/CSS/JS. Data persists via window.storage with an
  in-memory fallback so it still runs outside that environment.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg:#e6eaee; --bg-2:#dbe1e6; --panel:#f5f7f9; --card:#fff;
    --ink:#16232e; --muted:#62727d; --faint:#8a97a0;
    --line:#d5dde2; --line-strong:#c3cdd4;
    --brand:#2b3a8f; --brand-dark:#212d70; --brand-tint:#eaedf8;
    --pri-high:#c63a3a; --pri-med:#c0812c; --pri-low:#3e8e63;
    --shadow-sm:0 1px 2px rgba(22,35,46,.06),0 1px 3px rgba(22,35,46,.05);
    --shadow-md:0 6px 16px rgba(22,35,46,.10),0 2px 6px rgba(22,35,46,.08);
    --shadow-lg:0 18px 44px rgba(22,35,46,.20);
    --r:10px;
    --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --display:"Space Grotesk",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:var(--sans);color:var(--ink);
    background:radial-gradient(1200px 600px at 85% -10%,#eef1f4 0%,transparent 60%),var(--bg);
    -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px;}

  .app{display:flex;flex-direction:column;height:100vh;}

  /* topbar */
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;
    background:rgba(255,255,255,.72);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .brand{display:flex;align-items:baseline;gap:10px;font-family:var(--display);
    font-weight:700;font-size:19px;letter-spacing:-.02em;white-space:nowrap;}
  .brand .mark{display:inline-block;width:12px;height:20px;border-radius:2px;
    background:linear-gradient(var(--pri-low) 0 33%,var(--brand) 33% 66%,#c26a2f 66% 100%);transform:translateY(2px);}
  .brand small{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--faint);}
  .spacer{flex:1 1 auto;}
  .toggle{display:inline-flex;background:var(--bg-2);border-radius:10px;padding:3px;gap:2px;}
  .toggle button{border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:500;
    padding:6px 14px;border-radius:8px;}
  .toggle button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);}
  .stat{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:6px;white-space:nowrap;}
  .stat b{color:var(--ink);font-weight:500;}
  .stat.over b{color:var(--pri-high);}

  .btn{border:1px solid var(--line-strong);background:#fff;color:var(--ink);
    padding:9px 14px;border-radius:var(--r);font-size:14px;font-weight:500;
    box-shadow:var(--shadow-sm);transition:transform .08s,box-shadow .15s,background .15s;}
  .btn:hover{box-shadow:var(--shadow-md);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-dark);}
  .btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted);padding:8px;}
  .btn.ghost:hover{background:var(--bg-2);color:var(--ink);}
  .btn.sm{padding:6px 10px;font-size:13px;}

  .main{display:flex;flex:1 1 auto;min-height:0;}

  /* sidebar */
  .sidebar{width:256px;flex:0 0 256px;border-right:1px solid var(--line);
    background:var(--panel);padding:16px 12px;overflow-y:auto;}
  .side-head{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);margin:4px 8px 8px;}
  .navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;
    border:none;background:transparent;text-align:left;font-size:14px;color:var(--ink);margin-bottom:2px;transition:background .12s;}
  .navbtn:hover{background:var(--bg-2);}
  .navbtn.active{background:var(--brand-tint);color:var(--brand-dark);font-weight:600;}
  .navbtn .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .navbtn .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .navbtn .ct{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .navbtn.active .ct{color:var(--brand);}
  .prog-group{margin-bottom:6px;}
  .prog-head{display:flex;align-items:center;gap:8px;width:100%;padding:8px 8px;border-radius:8px;
    border:none;background:transparent;text-align:left;color:var(--ink);}
  .prog-head:hover{background:var(--bg-2);}
  .prog-head.active{background:var(--brand-tint);}
  .prog-head .caret{font-size:10px;color:var(--faint);width:12px;transition:transform .15s;}
  .prog-head.collapsed .caret{transform:rotate(-90deg);}
  .prog-head .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto;}
  .prog-head .nm{flex:1 1 auto;font-family:var(--display);font-weight:600;font-size:13.5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .prog-head .ct{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .prog-head .edit{opacity:0;font-size:11px;color:var(--faint);border:none;background:transparent;padding:2px 4px;border-radius:5px;}
  .prog-head:hover .edit{opacity:1;}
  .prog-head .edit:hover{background:#fff;color:var(--ink);}
  .proj-list{margin:2px 0 4px 14px;padding-left:8px;border-left:1px solid var(--line);}
  .proj{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:7px;
    border:none;background:transparent;text-align:left;font-size:13px;color:var(--muted);}
  .proj:hover{background:var(--bg-2);color:var(--ink);}
  .proj.active{background:var(--brand-tint);color:var(--brand-dark);font-weight:600;}
  .proj .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .proj .ct{font-family:var(--mono);font-size:10.5px;color:var(--faint);}
  .proj .edit{opacity:0;font-size:10px;color:var(--faint);border:none;background:transparent;padding:2px 4px;border-radius:5px;}
  .proj:hover .edit{opacity:1;}
  .proj .edit:hover{background:#fff;color:var(--ink);}
  .add-proj{width:100%;text-align:left;padding:5px 8px;border-radius:7px;border:none;background:transparent;
    color:var(--faint);font-size:12px;font-family:var(--mono);}
  .add-proj:hover{color:var(--brand);}
  .side-sep{height:1px;background:var(--line);margin:12px 8px;}
  .add-prog{width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px dashed var(--line-strong);
    background:transparent;color:var(--muted);font-size:13px;margin-top:4px;}
  .add-prog:hover{border-color:var(--brand);color:var(--brand);background:#fff;}
  .data-row{display:flex;gap:8px;padding:0 4px;}
  .data-row .btn{flex:1 1 0;}
  .data-hint{font-family:var(--mono);font-size:10.5px;color:var(--faint);padding:8px 6px 0;line-height:1.5;}
  .data-hint.warn{color:var(--pri-med);}
  .sync-status{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:8px 6px 4px;line-height:1.5;}
  .sync-status.ok{color:var(--pri-low);}
  .sync-status.warn{color:var(--pri-med);}

  /* board / week area */
  .content{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
  .tools{display:flex;align-items:center;gap:12px;padding:14px 22px 4px;flex-wrap:wrap;}
  .view-title{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
  .view-title .dot{width:11px;height:11px;border-radius:3px;}
  .tools .right{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .sortsel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .sortsel select{font-family:var(--sans);font-size:13px;color:var(--ink);
    border:1px solid var(--line-strong);background:#fff;border-radius:8px;padding:6px 8px;}
  .weeknav{display:flex;align-items:center;gap:6px;}
  .weeknav .range{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:150px;text-align:center;}
  .weeknav button{border:1px solid var(--line-strong);background:#fff;border-radius:8px;padding:5px 9px;font-size:13px;color:var(--ink);box-shadow:var(--shadow-sm);}
  .weeknav button:hover{box-shadow:var(--shadow-md);}

  /* board */
  .board{display:flex;gap:16px;padding:12px 22px 22px;overflow-x:auto;flex:1 1 auto;min-height:0;}
  .col{flex:1 1 0;min-width:280px;display:flex;flex-direction:column;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;min-height:0;}
  .col-head{padding:14px 16px 10px;}
  .col-head .row{display:flex;align-items:center;gap:8px;}
  .col-name{font-family:var(--display);font-weight:600;font-size:14px;}
  .col-count{font-family:var(--mono);font-size:12px;color:var(--faint);}
  .lane-bar{height:3px;border-radius:2px;margin-top:10px;background:var(--line);overflow:hidden;}
  .lane-bar>span{display:block;height:100%;border-radius:2px;}
  .col[data-status="todo"] .lane-bar>span{background:var(--faint);}
  .col[data-status="doing"] .lane-bar>span{background:var(--brand);}
  .col[data-status="done"] .lane-bar>span{background:var(--pri-low);}
  .col-body{padding:10px 12px 14px;overflow-y:auto;flex:1 1 auto;display:flex;flex-direction:column;gap:10px;}
  .col.drop-target{outline:2px dashed var(--brand);outline-offset:-4px;border-radius:14px;}

  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:12px 12px 10px 15px;box-shadow:var(--shadow-sm);cursor:grab;
    transition:box-shadow .15s,transform .08s,opacity .15s;}
  .card:hover{box-shadow:var(--shadow-md);}
  .card:active{cursor:grabbing;}
  .card.dragging{opacity:.45;}
  .card .spine{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}
  .card .prog-label{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;}
  .card .ttl{font-size:14px;font-weight:500;line-height:1.35;margin:0 0 8px;word-break:break-word;}
  .card.done .ttl{text-decoration:line-through;color:var(--muted);}
  .card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 8px;border-radius:20px;
    background:var(--bg-2);color:var(--muted);max-width:100%;}
  .chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .due{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;}
  .due.overdue{color:var(--pri-high);font-weight:500;}
  .due.soon{color:var(--pri-med);font-weight:500;}
  .steps-badge{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;}
  .steps-badge.hassched{color:var(--brand);}
  .card-actions{position:absolute;top:8px;right:8px;display:flex;gap:2px;opacity:0;transition:opacity .12s;}
  .card:hover .card-actions,.card:focus-within .card-actions{opacity:1;}
  .card-actions button{border:none;background:transparent;color:var(--faint);font-size:13px;padding:4px 5px;border-radius:6px;}
  .card-actions button:hover{background:var(--bg-2);color:var(--ink);}
  .move-row{display:flex;gap:6px;margin-top:10px;}
  .move-row button{flex:1 1 auto;font-family:var(--mono);font-size:11px;color:var(--muted);
    border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px;}
  .move-row button:hover:not(:disabled){border-color:var(--brand);color:var(--brand);}
  .move-row button:disabled{opacity:.35;cursor:default;}

  /* week view */
  .week{display:flex;gap:14px;padding:12px 22px 22px;overflow-x:auto;flex:1 1 auto;min-height:0;}
  .day{flex:1 1 0;min-width:200px;display:flex;flex-direction:column;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;min-height:0;}
  .day.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);}
  .day-head{padding:12px 14px 8px;display:flex;align-items:baseline;justify-content:space-between;}
  .day-name{font-family:var(--display);font-weight:600;font-size:14px;}
  .day.today .day-name{color:var(--brand);}
  .day-date{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .day-body{padding:8px 10px 10px;overflow-y:auto;flex:1 1 auto;display:flex;flex-direction:column;gap:8px;}
  .day.drop-target{outline:2px dashed var(--brand);outline-offset:-4px;}
  .witem{display:flex;gap:9px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:9px 10px 9px 11px;box-shadow:var(--shadow-sm);position:relative;cursor:pointer;}
  .witem .wspine{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
  .witem .cb{flex:0 0 auto;width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-strong);
    background:#fff;margin-top:1px;display:grid;place-items:center;cursor:pointer;transition:.12s;}
  .witem .cb:hover{border-color:var(--brand);}
  .witem.done .cb{background:var(--pri-low);border-color:var(--pri-low);}
  .witem .cb svg{opacity:0;}
  .witem.done .cb svg{opacity:1;}
  .witem .wbody{flex:1 1 auto;min-width:0;}
  .witem .wparent{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.02em;
    text-transform:uppercase;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .witem .wtitle{font-size:13.5px;line-height:1.3;word-break:break-word;}
  .witem.done .wtitle{text-decoration:line-through;color:var(--muted);}
  .witem .wtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;}
  .tag{font-family:var(--mono);font-size:10px;color:var(--faint);display:inline-flex;align-items:center;gap:4px;}
  .tag.recur{color:var(--brand);}
  .tag.carried{color:var(--pri-med);}
  .add-day{width:100%;text-align:left;padding:7px 9px;border-radius:8px;border:1px dashed var(--line-strong);
    background:transparent;color:var(--faint);font-size:12px;}
  .add-day:hover{border-color:var(--brand);color:var(--brand);background:#fff;}
  .day-empty{color:var(--faint);font-size:12px;text-align:center;padding:14px 6px;line-height:1.5;}

  .empty{text-align:center;color:var(--faint);font-size:13px;padding:26px 12px;line-height:1.5;}
  .empty b{color:var(--muted);font-weight:500;}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(22,35,46,.42);display:none;align-items:center;
    justify-content:center;padding:20px;z-index:40;}
  .scrim.open{display:flex;}
  .modal{width:100%;max-width:480px;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);
    padding:22px;max-height:92vh;overflow-y:auto;}
  .modal h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 16px;letter-spacing:-.01em;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--faint);margin-bottom:6px;}
  .field input[type="text"],.field textarea,.field select,.field input[type="date"],.field input[type="number"]{
    width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);border:1px solid var(--line-strong);
    border-radius:9px;padding:9px 11px;background:#fff;}
  .field textarea{resize:vertical;min-height:52px;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand);}
  .two{display:flex;gap:12px;}
  .two>.field{flex:1 1 0;}
  .inline-link{border:none;background:transparent;color:var(--brand);font-size:12px;font-weight:500;padding:0;margin-top:6px;cursor:pointer;}
  .inline-link:hover{text-decoration:underline;}
  .segs{display:flex;gap:8px;}
  .seg{flex:1 1 0;text-align:center;padding:8px;border-radius:9px;font-size:13px;font-weight:500;
    border:1px solid var(--line-strong);background:#fff;color:var(--muted);}
  .seg[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;}
  .daychips{display:flex;gap:6px;}
  .daychip{flex:1 1 0;text-align:center;padding:7px 0;border-radius:8px;font-family:var(--mono);font-size:12px;
    border:1px solid var(--line-strong);background:#fff;color:var(--muted);}
  .daychip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;}
  .swatch{width:26px;height:26px;border-radius:6px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-strong);}
  .swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink);}
  .series-note{background:var(--brand-tint);color:var(--brand-dark);font-size:12.5px;padding:9px 11px;border-radius:9px;margin-bottom:14px;}

  /* steps editor */
  .steps-box{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel);}
  .step-row{display:flex;align-items:center;gap:8px;padding:5px 4px;}
  .step-row .scb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-strong);background:#fff;
    display:grid;place-items:center;flex:0 0 auto;}
  .step-row.done .scb{background:var(--pri-low);border-color:var(--pri-low);}
  .step-row .scb svg{opacity:0;}
  .step-row.done .scb svg{opacity:1;}
  .step-row input.stext{flex:1 1 auto;border:none;background:transparent;font-size:13.5px;padding:3px 2px;color:var(--ink);}
  .step-row.done input.stext{text-decoration:line-through;color:var(--muted);}
  .step-row input.stext:focus{outline:none;border-bottom:1px solid var(--brand);}
  .step-days{display:flex;gap:3px;}
  .sday{width:22px;height:22px;border-radius:6px;border:1px solid var(--line-strong);background:#fff;
    font-family:var(--mono);font-size:10px;color:var(--muted);padding:0;}
  .sday[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;}
  .step-row .srm{border:none;background:transparent;color:var(--faint);font-size:14px;padding:2px 5px;border-radius:5px;}
  .step-row .srm:hover{background:#fbeaea;color:var(--pri-high);}
  .add-step{border:none;background:transparent;color:var(--brand);font-size:13px;font-weight:500;padding:6px 4px;margin-top:2px;}

  .modal-actions{display:flex;gap:10px;align-items:center;margin-top:20px;}
  .modal-actions .right{display:flex;gap:10px;margin-left:auto;}
  .danger{color:var(--pri-high);border:none;background:transparent;font-size:13px;padding:8px;border-radius:8px;}
  .danger:hover{background:#fbeaea;}

  .menu-btn{display:none;}
  @media (max-width:760px){
    .sidebar{position:fixed;inset:54px auto 0 0;z-index:30;transform:translateX(-100%);transition:transform .2s;
      box-shadow:var(--shadow-lg);height:calc(100vh - 54px);}
    .sidebar.show{transform:translateX(0);}
    .menu-btn{display:inline-flex;}
    .board,.week{flex-direction:column;overflow-x:hidden;}
    .col,.day{min-width:0;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>

<div class="app">
  <div class="topbar">
    <button class="btn ghost menu-btn" id="menuBtn" aria-label="Toggle sidebar">☰</button>
    <div class="brand"><span class="mark"></span>Rebecca's Radar</div>
    <div class="toggle" role="group" aria-label="View">
      <button id="viewBoard" aria-pressed="true">Board</button>
      <button id="viewWeek" aria-pressed="false">Week</button>
    </div>
    <div class="spacer"></div>
    <div class="stat over" title="This week's tasks still to do"><b id="statWeek">0</b> this week</div>
    <button class="btn primary" id="newTaskBtn">+ New task</button>
  </div>

  <div class="main">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">Filter</div>
      <div id="nav"></div>
      <div class="side-sep"></div>
      <button class="add-prog" id="addProgBtn">+ New program</button>
      <div class="side-sep"></div>
      <div class="side-head">Your data</div>
      <div class="data-row">
        <button class="btn sm" id="exportBtn">Back up ↓</button>
        <button class="btn sm" id="importBtn">Restore ↑</button>
      </div>
      <div id="fsaSection" style="display:none">
        <div class="sync-status" id="syncStatus"></div>

<script>
(function(){
  "use strict";
  const CHECK = '<svg width="11" height="11" viewBox="0 0 12 12"><path d="M2 6.5L4.5 9L10 3" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* ---------- storage ----------
     Priority: (1) Claude artifact storage when running inside Claude,
     (2) the browser's localStorage when opened as a downloaded file,
     (3) in-memory as a last resort. Data mode is reported in the sidebar. */
  const KEY="flightdeck:data";
  const mem={};
  const hasStore = typeof window!=="undefined" && window.storage && typeof window.storage.get==="function";
  let lsOK=false;
  try{ const k="__rr_test__"; window.localStorage.setItem(k,"1"); window.localStorage.removeItem(k); lsOK=true; }catch(e){ lsOK=false; }
  let isFile=false; try{ isFile = window.location && window.location.protocol==="file:"; }catch(e){}
  const storeMode = hasStore ? "cloud" : (isFile ? "file" : (lsOK ? "local" : "memory"));

  // "Sync to a real file" via the File System Access API — only in a secure context (https / localhost).
  const FSA = (typeof window!=="undefined") && window.isSecureContext && ("showSaveFilePicker" in window) && ("showOpenFilePicker" in window);
  let fileHandle=null;       // connected + permission granted this session (durable source of truth)
  let pendingHandle=false;   // a file is remembered but needs a one-click reconnect
  let rememberedHandle=null; // the stored handle awaiting reconnect
  let writing=false, writeAgain=false;

  async function loadData(){
    if(hasStore){ try{ const r=await window.storage.get(KEY,false); if(r&&r.value) return JSON.parse(r.value);}catch(e){} return null; }
    if(lsOK){ try{ const v=window.localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
    return mem[KEY]?JSON.parse(mem[KEY]):null;
  }
  async function saveData(){
    const p=JSON.stringify(state);
    if(hasStore){ try{ await window.storage.set(KEY,p,false); }catch(e){} }
    else if(lsOK){ try{ window.localStorage.setItem(KEY,p); }catch(e){} }
    else mem[KEY]=p;
    if(fileHandle) writeToFile(); // durable copy; best-effort, doesn't block the UI
  }
  async function writeToFile(){
    if(!fileHandle) return;
    if(writing){ writeAgain=true; return; }
    writing=true;
    try{ const w=await fileHandle.createWritable(); await w.write(JSON.stringify(state,null,2)); await w.close(); }
    catch(e){ console.error("file write failed",e); }
    writing=false;
    if(writeAgain){ writeAgain=false; writeToFile(); }
  }

  /* IndexedDB: remember the chosen file between sessions */
  function idbReq(mode,fn){
    return new Promise((res,rej)=>{ const o=indexedDB.open("rr-fs",1);
      o.onupgradeneeded=()=>{ if(!o.result.objectStoreNames.contains("h")) o.result.createObjectStore("h"); };
      o.onsuccess=()=>{ const db=o.result; const tx=db.transaction("h",mode); const r=fn(tx.objectStore("h"));
        tx.oncomplete=()=>{ db.close(); res(r?r.result:undefined); };
        tx.onerror=()=>{ db.close(); rej(tx.error); }; };
      o.onerror=()=>rej(o.error); });
  }
  const idbSet=(k,v)=>idbReq("readwrite",st=>st.put(v,k));
  const idbGet=(k)=>idbReq("readonly",st=>st.get(k));
  const idbDel=(k)=>idbReq("readwrite",st=>st.delete(k));

  async function verifyPermission(handle){
    const opts={mode:"readwrite"};
    try{
      if((await handle.queryPermission(opts))==="granted") return true;
      if((await handle.requestPermission(opts))==="granted") return true;
    }catch(e){}
    return false;
  }
  function adoptState(data){
    state=Object.assign({version:2,programs:[],projects:[],tasks:[],ui:{}},data);
    state.ui=Object.assign({view:"board",filter:{type:"all"},sort:"created",weekStart:null,collapsed:{}},data.ui||{});
    state.ui.weekStart=isoDate(mondayOf(new Date()));
    ensureRecurring(state.ui.weekStart); rollForward();
  }

  async function linkNewFile(){
    if(!FSA){ alert("This browser can't save directly to files here. Make sure you're on the hosted https address, or use Back up / Restore."); return; }
    try{
      const handle=await window.showSaveFilePicker({suggestedName:"rebeccas-radar-data.json",
        types:[{description:"Rebecca's Radar data",accept:{"application/json":[".json"]}}]});
      fileHandle=handle; pendingHandle=false; rememberedHandle=handle;
      await writeToFile();
      try{ await idbSet("handle",handle); }catch(e){}
      updateDataUI();
      alert("Linked. Your board now saves straight to that file automatically.");
    }catch(e){ if(e && e.name!=="AbortError"){ console.error(e); alert("Couldn't link that file."); } }
  }
  async function openExistingFile(){
    if(!FSA){ alert("This browser can't open files here. Use Restore instead."); return; }
    try{
      const [handle]=await window.showOpenFilePicker({multiple:false,
        types:[{description:"Rebecca's Radar data",accept:{"application/json":[".json"]}}]});
      const text=await (await handle.getFile()).text();
      let data=JSON.parse(text);
      if(data && data.version<2) data=migrate(data);
      if(!data || !Array.isArray(data.programs) || !Array.isArray(data.tasks)){ alert("That file isn't valid board data."); return; }
      if(!confirm("Load this file and keep syncing to it from now on? It replaces what's currently on the board.")) return;
      adoptState(data); fileHandle=handle; pendingHandle=false; rememberedHandle=handle;
      try{ await idbSet("handle",handle); }catch(e){}
      await saveData(); updateDataUI(); render();
    }catch(e){ if(e && e.name!=="AbortError"){ console.error(e); alert("Couldn't open that file."); } }
  }
  async function reconnectFile(){
    let handle=rememberedHandle; if(!handle){ try{ handle=await idbGet("handle"); }catch(e){} }
    if(!handle){ pendingHandle=false; updateDataUI(); return; }
    const ok=await verifyPermission(handle);
    if(!ok){ alert("Permission was declined, so the file wasn't reconnected."); return; }
    try{
      const text=await (await handle.getFile()).text();
      let data=JSON.parse(text);
      if(data && data.version<2) data=migrate(data);
      if(data && Array.isArray(data.programs) && Array.isArray(data.tasks)) adoptState(data);
      fileHandle=handle; pendingHandle=false;
      await saveData(); updateDataUI(); render();
    }catch(e){ console.error(e); alert("Couldn't read the linked file."); }
  }
  async function unlinkFile(){
    fileHandle=null; pendingHandle=false; rememberedHandle=null;
    try{ await idbDel("handle"); }catch(e){}
    updateDataUI();
  }

  function updateDataUI(){
    const sec=document.getElementById("fsaSection");
    const st=document.getElementById("syncStatus");
    const rc=document.getElementById("reconnectBtn");
    const ul=document.getElementById("unlinkBtn");
    const hint=document.getElementById("dataHint");
    const exp=document.getElementById("exportBtn");
    if(sec) sec.style.display=FSA?"":"none";
    if(!FSA){
      if(hint){
        if(storeMode==="cloud"){ hint.className="data-hint"; hint.textContent="Saved to your Claude account."; }
        else if(storeMode==="file"){ hint.className="data-hint warn"; hint.textContent="Opened as a downloaded file — Chrome won't reliably save here. Open it from your hosted https address, then use Save to file."; if(exp)exp.classList.add("primary"); }
        else if(storeMode==="local"){ hint.className="data-hint"; hint.textContent="Saved in this browser. Back up now and then to keep a copy."; }
        else { hint.className="data-hint warn"; hint.textContent="Not saving automatically here — Back up before closing."; if(exp)exp.classList.add("primary"); }
      }
      return;
    }
    if(fileHandle){
      if(st){ st.className="sync-status ok"; st.textContent="✓ Syncing to "+(fileHandle.name||"your file"); }
      if(rc){ rc.style.display="none"; rc.classList.remove("primary"); }
      if(ul) ul.style.display="inline-block";
      if(hint){ hint.className="data-hint"; hint.textContent="Your board saves to a real file on your computer, safe from browser clearing. An occasional Back up is still wise."; }
    } else if(pendingHandle){
      if(st){ st.className="sync-status warn"; st.textContent="⚠ Your data file isn't connected yet this session."; }
      if(rc){ rc.style.display="block"; rc.classList.add("primary"); }
      if(ul) ul.style.display="inline-block";
      if(hint){ hint.className="data-hint warn"; hint.textContent="Click “Reconnect data file” to load your saved data and resume syncing."; }
    } else {
      if(st){ st.className="sync-status"; st.textContent="Not linked to a file yet."; }
      if(rc) rc.style.display="none";
      if(ul) ul.style.display="none";
      if(hint){ hint.className="data-hint"; hint.textContent="Tip: use “Save to file…” so your data lives in a file that survives any browser clearing."; }
    }
  }

  function exportData(){
    try{
      const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download="rebeccas-radar-backup-"+todayISO()+".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }catch(e){ alert("Sorry — couldn't create the backup file."); }
  }
  function importData(file){
    const reader=new FileReader();
    reader.onload=()=>{
      let data;
      try{ data=JSON.parse(reader.result); }
      catch(e){ alert("Couldn't read that file — it isn't valid backup data."); return; }
      if(data && data.version<2) data=migrate(data);
      if(!data || !Array.isArray(data.programs) || !Array.isArray(data.tasks)){
        alert("That doesn't look like a Rebecca's Radar backup."); return;
      }
      if(!confirm("Import this backup? It will replace everything currently on your board.")) return;
      state=Object.assign({version:2,programs:[],projects:[],tasks:[],ui:{}},data);
      state.ui=Object.assign({view:"board",filter:{type:"all"},sort:"created",weekStart:null,collapsed:{}},data.ui||{});
      state.ui.weekStart=isoDate(mondayOf(new Date()));
      ensureRecurring(state.ui.weekStart); rollForward();
      saveData(); setView(state.ui.view||"board");
      alert("Backup restored.");
    };
    reader.readAsText(file);
  }

  /* ---------- date helpers ---------- */
  const DAYS=[{k:"mon",label:"Mon"},{k:"tue",label:"Tue"},{k:"wed",label:"Wed"},{k:"thu",label:"Thu"},{k:"fri",label:"Fri"}];
  function isoDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function fromISO(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
  function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function mondayOf(d){const x=new Date(d);const wd=(x.getDay()+6)%7;return addDays(x,-wd);}
  function todayISO(){return isoDate(new Date());}
  function isWeekend(d){const g=d.getDay();return g===0||g===6;}
  function nextWeekdayISO(){let d=new Date();while(isWeekend(d))d=addDays(d,1);return isoDate(d);}
  function dayIndexOfISO(s){return(fromISO(s).getDay()+6)%7;}
  function fmtShort(s){return fromISO(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});}

  /* ---------- state ---------- */
  const SWATCHES=["#3e8e63","#2b5fa8","#c26a2f","#7a4fb0","#0f8a8a","#c63a3a","#2b3a8f","#5a6b76"];
  const STATUSES=[{id:"todo",name:"To Do"},{id:"doing",name:"Doing"},{id:"done",name:"Done"}];
  let state={version:2,programs:[],projects:[],tasks:[],ui:{view:"board",filter:{type:"all"},sort:"created",weekStart:null,collapsed:{}}};
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const progById=id=>state.programs.find(p=>p.id===id);
  const projById=id=>state.projects.find(p=>p.id===id);
  const projsOf=pid=>state.projects.filter(p=>p.programId===pid);

  function seed(){
    const bio={id:"bio",name:"Biodiversity",color:"#3e8e63"};
    const met={id:"met",name:"Methodology",color:"#2b5fa8"};
    const tech={id:"tech",name:"Tech",color:"#c26a2f"};
    state.programs=[bio,met,tech];
    const pjField={id:uid(),name:"Field season 2026",programId:"bio"};
    const pjStart={id:uid(),name:"Getting started",programId:"met"};
    const pjPlat={id:uid(),name:"Platform",programId:"tech"};
    state.projects=[pjField,pjStart,pjPlat];
    const wk=mondayOf(new Date());
    const wedISO=isoDate(addDays(wk,2));
    state.tasks=[
      {id:uid(),kind:"project",title:"Take the board for a spin",notes:"Drag me between columns.",programId:"met",projectId:pjStart.id,status:"doing",due:null,
        steps:[{id:uid(),text:"Drag this card to another column",done:false,scheduledDate:null},
               {id:uid(),text:"Schedule this step onto Wednesday →",done:false,scheduledDate:wedISO}],createdAt:Date.now()},
      {id:uid(),kind:"project",title:"Draft monitoring plan",notes:"",programId:"bio",projectId:pjField.id,status:"todo",due:isoDate(addDays(new Date(),5)),
        steps:[{id:uid(),text:"List target species",done:false,scheduledDate:null},{id:uid(),text:"Define transects",done:false,scheduledDate:null}],createdAt:Date.now()-1},
      {id:uid(),kind:"project",title:"Fix data export bug",notes:"",programId:"tech",projectId:pjPlat.id,status:"todo",due:null,steps:[],createdAt:Date.now()-2},
      {id:uid(),kind:"daily",title:"Review inbox & triage",notes:"",programId:"met",projectId:null,scheduledDate:nextWeekdayISO(),day:null,done:false,createdAt:Date.now()-3},
      // recurring template
      {id:uid(),kind:"template",isTemplate:true,title:"Weekly team stand-up",notes:"",programId:"met",projectId:null,
        recur:{days:["mon","wed","fri"],interval:1},anchorDate:isoDate(wk),createdAt:Date.now()-4},
    ];
  }

  function migrate(old){
    // v1 -> v2
    if(!old || old.version>=2){ return old; }
    const met={id:"met",name:"Methodology",color:"#2b5fa8"};
    const bio={id:"bio",name:"Biodiversity",color:"#3e8e63"};
    const tech={id:"tech",name:"Tech",color:"#c26a2f"};
    const programs=[bio,met,tech];
    const projects=(old.projects||[]).map(p=>({id:p.id,name:p.name,programId:"met"}));
    const tasks=(old.tasks||[]).map(t=>({
      id:t.id,kind:"project",title:t.title,notes:t.notes||"",
      programId:(projects.find(p=>p.id===t.projectId)?"met":"met"),
      projectId:t.projectId||null,status:t.status||"todo",due:t.due||null,steps:[],createdAt:t.createdAt||Date.now()
    }));
    return {version:2,programs,projects,tasks,ui:{view:"board",filter:{type:"all"},sort:"created",weekStart:null,collapsed:{}}};
  }

  /* ---------- recurrence + roll-forward ---------- */
  function ensureRecurring(weekMonISO){
    const weekMon=fromISO(weekMonISO);
    state.tasks.filter(t=>t.isTemplate).forEach(tpl=>{
      const anchor=mondayOf(fromISO(tpl.anchorDate));
      const wks=Math.round((weekMon-anchor)/(7*86400000));
      if(wks<0) return;
      if(wks%((tpl.recur&&tpl.recur.interval)||1)!==0) return;
      (tpl.recur.days||[]).forEach(dk=>{
        const di=DAYS.findIndex(d=>d.k===dk); if(di<0) return;
        const date=isoDate(addDays(weekMon,di));
        if(!state.tasks.some(t=>t.templateId===tpl.id&&t.scheduledDate===date)){
          state.tasks.push({id:uid(),kind:"daily",title:tpl.title,notes:tpl.notes||"",programId:tpl.programId,
            projectId:tpl.projectId||null,scheduledDate:date,day:dk,done:false,templateId:tpl.id,createdAt:Date.now()});
        }
      });
    });
  }
  function rollForward(){
    const target=nextWeekdayISO(); let changed=false;
    state.tasks.forEach(t=>{
      if(t.kind==="daily"&&!t.done&&!t.templateId&&t.scheduledDate&&t.scheduledDate<target){
        if(!t.carriedFrom)t.carriedFrom=t.scheduledDate; t.scheduledDate=target; changed=true;
      }
    });
    state.tasks.forEach(t=>{(t.steps||[]).forEach(s=>{
      if(s.scheduledDate&&!s.done&&s.scheduledDate<target){ if(!s.carriedFrom)s.carriedFrom=s.scheduledDate; s.scheduledDate=target; changed=true; }
    });});
    return changed;
  }

  /* ---------- filtering ---------- */
  function matches(t){
    const f=state.ui.filter;
    if(f.type==="all")return true;
    if(f.type==="program")return t.programId===f.id;
    if(f.type==="project")return t.projectId===f.id;
    return true;
  }

  /* ---------- render ---------- */
  const $=s=>document.querySelector(s);
  const nav=$("#nav"), tools=$("#tools"), stage=$("#stage");

  function render(){ renderSidebar(); renderStats(); renderTools(); if(state.ui.view==="board")renderBoard(); else renderWeek(); }

  function renderStats(){
    // Always the real current Mon–Fri, independent of week-view navigation.
    const mon=mondayOf(new Date());
    const set=new Set(DAYS.map((d,i)=>isoDate(addDays(mon,i))));
    const weekOpen=state.tasks.filter(t=>t.kind==="daily"&&!t.done&&set.has(t.scheduledDate)).length
      + state.tasks.reduce((n,t)=>n+((t.steps||[]).filter(s=>!s.done&&set.has(s.scheduledDate)).length),0);
    $("#statWeek").textContent=weekOpen;
  }

  function renderSidebar(){
    nav.innerHTML="";
    const f=state.ui.filter;
    const allBtn=document.createElement("button");
    allBtn.className="navbtn"+(f.type==="all"?" active":"");
    allBtn.innerHTML='<span class="dot" style="background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)"></span><span class="nm">All programs</span><span class="ct">'+state.tasks.filter(t=>!t.isTemplate).length+'</span>';
    allBtn.onclick=()=>setFilter({type:"all"});
    nav.appendChild(allBtn);

    state.programs.forEach(pg=>{
      const grp=document.createElement("div"); grp.className="prog-group";
      const collapsed=!!state.ui.collapsed[pg.id];
      const cnt=state.tasks.filter(t=>!t.isTemplate&&t.programId===pg.id).length;
      const head=document.createElement("button");
      head.className="prog-head"+(f.type==="program"&&f.id===pg.id?" active":"")+(collapsed?" collapsed":"");
      head.innerHTML='<span class="caret">▾</span><span class="dot" style="background:'+pg.color+'"></span><span class="nm"></span><span class="ct">'+cnt+'</span><button class="edit" title="Edit">edit</button>';
      head.querySelector(".nm").textContent=pg.name;

      grp.appendChild(head);

        const list=document.createElement("div"); list.className="proj-list";

  function setFilter(f){ state.ui.filter=f; saveData(); render(); if(window.innerWidth<=760)$("#sidebar").classList.remove("show"); }

  function filterTitle(){
    const f=state.ui.filter;

    if(f.type==="project"){const p=projById(f.id);const g=p&&progById(p.programId);return p?{html:'<span class="dot" style="background:'+(g?g.color:"#ccc")+'"></span>'+esc(p.name)}:{html:""};}
    return{html:""};
  }

  function sortTasks(list){
    const s=state.ui.sort; const a=list.slice();
    if(s==="due")a.sort((x,y)=>((x.due||"9999-99-99")<(y.due||"9999-99-99")?-1:1));
    else if(s==="alpha")a.sort((x,y)=>x.title.localeCompare(y.title));
    else a.sort((x,y)=>y.createdAt-x.createdAt);
    return a;
  }
  function dueInfo(due){
    if(!due)return null;
    const t=todayISO();const diff=Math.round((fromISO(due)-fromISO(t))/86400000);
    let cls="",label=fmtShort(due);
    if(diff<0){cls="overdue";label="Overdue · "+label;}
    else if(diff===0){cls="soon";label="Today";}
    else if(diff===1){cls="soon";label="Tomorrow";}
    else if(diff<=3)cls="soon";
    return{cls,label};
  }

  function renderBoard(){
    const tasks=state.tasks.filter(t=>t.kind==="project"&&matches(t));
    stage.className=""; stage.innerHTML='<div class="board" id="board"></div>';
    const board=$("#board");
    STATUSES.forEach(st=>{
      const inCol=sortTasks(tasks.filter(t=>t.status===st.id));
      const total=tasks.length||1;
      const col=document.createElement("section"); col.className="col"; col.dataset.status=st.id;
      col.innerHTML='<div class="col-head"><div class="row"><span class="col-name">'+st.name+'</span><span class="col-count">'+inCol.length+'</span></div><div class="lane-bar"><span style="width:'+Math.round(inCol.length/total*100)+'%"></span></div></div><div class="col-body"></div>';
      const body=col.querySelector(".col-body");
      if(inCol.length===0){const e=document.createElement("div");e.className="empty";
        e.innerHTML=st.id==="todo"?"Nothing queued.<br><b>Add a task</b> to start.":"Nothing here yet.<br>Drag a card in or use the arrows.";body.appendChild(e);}
      else inCol.forEach(t=>body.appendChild(cardEl(t)));
      col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("drop-target");});
      col.addEventListener("dragleave",()=>col.classList.remove("drop-target"));
      col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("drop-target");
        const id=e.dataTransfer.getData("text/plain");const t=state.tasks.find(x=>x.id===id);
        if(t&&t.status!==st.id){t.status=st.id;saveData();render();}});
      board.appendChild(col);
    });
  }

  function cardEl(t){
    const pg=progById(t.programId); const pj=t.projectId?projById(t.projectId):null;
    const di=dueInfo(t.due); const idx=STATUSES.findIndex(s=>s.id===t.status);
    const steps=t.steps||[]; const doneSteps=steps.filter(s=>s.done).length;
    const scheduled=steps.filter(s=>s.scheduledDate).length;
    const el=document.createElement("article");
    el.className="card"+(t.status==="done"?" done":""); el.dataset.id=t.id; el.draggable=true; el.tabIndex=0;
    el.innerHTML='<span class="spine" style="background:'+(pg?pg.color:"#ccc")+'"></span>'+
      '<div class="card-actions"><button class="ed" aria-label="Edit">✎</button></div>'+
      '<div class="prog-label" style="color:'+(pg?pg.color:"var(--faint)")+'">'+esc(pg?pg.name:"")+'</div>'+
      '<p class="ttl"></p><div class="meta">'+
      (pj?'<span class="chip"><span class="dot" style="background:'+(pg?pg.color:"#ccc")+'"></span><span class="nm"></span></span>':'')+
      (di?'<span class="due '+di.cls+'">◷ '+di.label+'</span>':'')+
      (steps.length?'<span class="steps-badge'+(scheduled?' hassched':'')+'">▤ '+doneSteps+'/'+steps.length+(scheduled?' · '+scheduled+' scheduled':'')+'</span>':'')+
      '</div><div class="move-row"><button class="mv" data-dir="-1" '+(idx===0?"disabled":"")+'>← '+(idx>0?STATUSES[idx-1].name:"")+'</button><button class="mv" data-dir="1" '+(idx===STATUSES.length-1?"disabled":"")+'>'+(idx<STATUSES.length-1?STATUSES[idx+1].name:"")+' →</button></div>';
    el.querySelector(".ttl").textContent=t.title;
    if(pj)el.querySelector(".chip .nm").textContent=pj.name;
    el.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",t.id);e.dataTransfer.effectAllowed="move";el.classList.add("dragging");});
    el.addEventListener("dragend",()=>el.classList.remove("dragging"));
    el.querySelector(".ed").onclick=e=>{e.stopPropagation();openTask(t.id);};
    el.onclick=()=>openTask(t.id);
    el.onkeydown=e=>{if(e.key==="Enter")openTask(t.id);};
    el.querySelectorAll(".mv").forEach(b=>b.onclick=e=>{e.stopPropagation();
      const ni=idx+parseInt(b.dataset.dir,10); if(ni>=0&&ni<STATUSES.length){t.status=STATUSES[ni].id;saveData();render();}});
    return el;
  }

  function weekDates(){ const mon=fromISO(state.ui.weekStart); return DAYS.map((d,i)=>isoDate(addDays(mon,i))); }

  function pushUnfinishedToNextWeek(){
    const set=new Set(weekDates()); // the currently displayed week
    const shift=s=>isoDate(addDays(fromISO(s),7));
    // non-recurring daily tasks still open in this week
    const dailies=state.tasks.filter(t=>t.kind==="daily"&&!t.done&&!t.templateId&&set.has(t.scheduledDate));
    // scheduled steps still open in this week
    const steps=[];
    state.tasks.forEach(t=>{(t.steps||[]).forEach(s=>{ if(!s.done&&set.has(s.scheduledDate)) steps.push(s); });});
    const total=dailies.length+steps.length;
    if(total===0){ alert("Nothing unfinished to move in this week."); return; }
    if(!confirm("Move "+total+" unfinished item"+(total===1?"":"s")+" to next week?")) return;
    dailies.forEach(t=>{ t.scheduledDate=shift(t.scheduledDate); });
    steps.forEach(s=>{ s.scheduledDate=shift(s.scheduledDate); });
    saveData(); renderWeek(); renderStats(); renderTools();
  }

  function renderWeek(){
    ensureRecurring(state.ui.weekStart);
    saveData();
    const dates=weekDates(); const today=todayISO();
    stage.className=""; stage.innerHTML='<div class="week" id="weekEl"></div>';
    const weekEl=$("#weekEl");
    DAYS.forEach((d,i)=>{
      const date=dates[i];
      // gather items
      const dailies=state.tasks.filter(t=>t.kind==="daily"&&t.scheduledDate===date&&matches(t));
      const stepItems=[];
      state.tasks.forEach(t=>{ if(t.kind==="project"&&matches(t)) (t.steps||[]).forEach(s=>{ if(s.scheduledDate===date) stepItems.push({parent:t,step:s}); }); });
      const openCount=dailies.filter(x=>!x.done).length+stepItems.filter(x=>!x.step.done).length;
      const col=document.createElement("section"); col.className="day"+(date===today?" today":""); col.dataset.date=date;
      col.innerHTML='<div class="day-head"><span class="day-name">'+d.label+'</span><span class="day-date">'+fmtShort(date)+(openCount?' · '+openCount:'')+'</span></div><div class="day-body"></div>';
      const body=col.querySelector(".day-body");
      const progOrder=id=>{const idx=state.programs.findIndex(p=>p.id===id);return idx<0?999:idx;};
      const items=[];
      dailies.forEach(t=>items.push({prog:progOrder(t.programId),el:dailyItemEl(t)}));
      stepItems.forEach(si=>items.push({prog:progOrder(si.parent.programId),el:stepItemEl(si)}));
      items.sort((a,b)=>a.prog-b.prog); // group by program (stable: dailies before steps within a program)
      if(items.length===0){const e=document.createElement("div");e.className="day-empty";e.textContent="Nothing planned";body.appendChild(e);}
      else items.forEach(it=>body.appendChild(it.el));
      const add=document.createElement("button"); add.className="add-day"; add.textContent="+ add task";
      add.onclick=()=>openTask(null,{kind:"daily",scheduledDate:date});
      body.appendChild(add);
      // drop target for moving daily tasks/steps between days
      col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("drop-target");});
      col.addEventListener("dragleave",()=>col.classList.remove("drop-target"));
      col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("drop-target");
        const raw=e.dataTransfer.getData("text/plain"); if(!raw.indexOf) return;
        if(raw.startsWith("daily:")){const t=state.tasks.find(x=>x.id===raw.slice(6));if(t){t.scheduledDate=date;t.day=d.k;saveData();renderWeek();}}
        else if(raw.startsWith("step:")){const[,tid,sid]=raw.split(":");const t=state.tasks.find(x=>x.id===tid);const s=t&&(t.steps||[]).find(x=>x.id===sid);if(s){s.scheduledDate=date;saveData();renderWeek();}}
      });
      weekEl.appendChild(col);
    });
  }

  function dailyItemEl(t){
    const pg=progById(t.programId); const pj=t.projectId?projById(t.projectId):null;
    const el=document.createElement("div"); el.className="witem"+(t.done?" done":""); el.draggable=true;
    el.innerHTML='<span class="wspine" style="background:'+(pg?pg.color:"#ccc")+'"></span>'+
      '<button class="cb" aria-label="Toggle done">'+CHECK+'</button><div class="wbody">'+
      '<div class="wtitle"></div><div class="wtags">'+
      '<span class="tag"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+(pg?pg.color:"#ccc")+'"></span>'+esc(pj?pj.name:(pg?pg.name:""))+'</span>'+
      (t.templateId?'<span class="tag recur">↻ repeats</span>':'')+
      (t.carriedFrom?'<span class="tag carried">⤶ carried over</span>':'')+
      '</div></div>';
    el.querySelector(".wtitle").textContent=t.title;
    el.querySelector(".cb").onclick=e=>{e.stopPropagation();t.done=!t.done;saveData();renderWeek();renderStats();};

  function stepItemEl(si){
    const t=si.parent, s=si.step; const pg=progById(t.programId);
    const el=document.createElement("div"); el.className="witem"+(s.done?" done":""); el.draggable=true;
    el.innerHTML='<span class="wspine" style="background:'+(pg?pg.color:"#ccc")+'"></span>'+
      '<button class="cb" aria-label="Toggle done">'+CHECK+'</button><div class="wbody">'+
      '<div class="wparent"></div><div class="wtitle"></div>'+
      (s.carriedFrom?'<div class="wtags"><span class="tag carried">⤶ carried over</span></div>':'')+
      '</div>';
    el.querySelector(".wparent").textContent="▤ "+t.title;
    el.querySelector(".wtitle").textContent=s.text;
    el.querySelector(".cb").onclick=e=>{e.stopPropagation();s.done=!s.done;saveData();renderWeek();renderStats();};
    el.onclick=()=>openTask(t.id);
    el.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain","step:"+t.id+":"+s.id);});
    return el;
  }

  function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

  /* ---------- task modal ---------- */
  const taskScrim=$("#taskScrim");
  let editingId=null, modalKind="project", modalSteps=[], modalDay=null;

  function fillProgramSelect(sel,val){ sel.innerHTML=state.programs.map(p=>'<option value="'+p.id+'"></option>').join("");
    Array.from(sel.options).forEach(o=>o.textContent=(progById(o.value)||{}).name||""); if(val)sel.value=val; }
  function fillProjectSelect(programId,val){
    const sel=$("#tProject"); const list=programId?projsOf(programId):[];
    sel.innerHTML='<option value="">No project</option>'+list.map(p=>'<option value="'+p.id+'"></option>').join("");
    Array.from(sel.options).forEach(o=>{if(o.value)o.textContent=(projById(o.value)||{}).name||"";});
    if(val)sel.value=val;
  }
  function setKind(k){ modalKind=k;
    document.querySelectorAll("#kindSegs .seg").forEach(s=>s.setAttribute("aria-pressed",s.dataset.kind===k?"true":"false"));
    $("#boardFields").style.display=k==="project"?"":"none";
    $("#dailyFields").style.display=k==="daily"?"":"none";
  }
  function buildDayChips(container,selected,single,onchange){
    container.innerHTML="";
    DAYS.forEach(d=>{const b=document.createElement("button");b.className="daychip";b.textContent=d.label;
      b.setAttribute("aria-pressed", (single? selected===d.k : selected.includes(d.k))?"true":"false");
      b.onclick=()=>onchange(d.k,b); container.appendChild(b);});
  }
  function renderStepsEditor(){
    const box=$("#stepsBox"); box.innerHTML="";
    if(modalSteps.length===0){const e=document.createElement("div");e.style.cssText="color:var(--faint);font-size:12px;padding:6px 4px";e.textContent="No steps yet.";box.appendChild(e);}
    const mon=state.ui.weekStart;
    modalSteps.forEach(s=>{
      const row=document.createElement("div"); row.className="step-row"+(s.done?" done":"");
      const cb=document.createElement("button"); cb.className="scb"; cb.innerHTML=CHECK; cb.onclick=()=>{s.done=!s.done;renderStepsEditor();};
      const inp=document.createElement("input"); inp.className="stext"; inp.type="text"; inp.value=s.text; inp.placeholder="Step…";
      inp.oninput=()=>{s.text=inp.value;};
      const days=document.createElement("div"); days.className="step-days";
      DAYS.forEach((d,i)=>{const db=document.createElement("button");db.className="sday";db.textContent=d.label[0];
        const date=isoDate(addDays(fromISO(mon),i));
        db.setAttribute("aria-pressed",s.scheduledDate===date?"true":"false");
        db.title="Schedule on "+d.label+" ("+fmtShort(date)+")";
        db.onclick=()=>{ s.scheduledDate = (s.scheduledDate===date? null : date); renderStepsEditor(); };
        days.appendChild(db);});
      const rm=document.createElement("button"); rm.className="srm"; rm.textContent="×"; rm.title="Remove step";
      rm.onclick=()=>{modalSteps=modalSteps.filter(x=>x.id!==s.id);renderStepsEditor();};
      row.append(cb,inp,days,rm); box.appendChild(row);
    });
  }
  function refreshRepeatUI(){
    const v=$("#tRepeat").value;
    $("#repeatDaysField").style.display=v==="weekly"?"":"none";
    $("#intervalField").style.display=v==="weekly"?"":"none";
  }
  function rebuildDayChips(){ buildDayChips($("#dayChips"),modalDay,true,k2=>{modalDay=k2;rebuildDayChips();}); }
  function rebuildRepeatDays(){ buildDayChips($("#repeatDays"),modalRepeatDays,false,k2=>{
    if(modalRepeatDays.includes(k2))modalRepeatDays=modalRepeatDays.filter(x=>x!==k2); else modalRepeatDays.push(k2);
    rebuildRepeatDays(); }); }

  let modalRepeatDays=[];
  function openTask(id,preset){
    editingId=id||null; preset=preset||{};
    const t=id?state.tasks.find(x=>x.id===id):null;
    $("#taskModalTitle").textContent=t?"Edit task":"New task";
    // kind
    const k=t?(t.kind==="project"?"project":"daily"):(preset.kind||(state.ui.view==="week"?"daily":"project"));
    setKind(k);
    // allow switching kind only on create
    document.querySelectorAll("#kindSegs .seg").forEach(b=>b.disabled=!!t);
    $("#kindSegs").style.opacity=t?".55":"1";
    // program/project
    const defProg=(state.ui.filter.type==="program"&&state.ui.filter.id)|| (state.ui.filter.type==="project"&&projById(state.ui.filter.id)&&projById(state.ui.filter.id).programId) || state.programs[0].id;
    const prog=t?t.programId:defProg;
    fillProgramSelect($("#tProgram"),prog);
    fillProjectSelect(prog, t?t.projectId:(state.ui.filter.type==="project"?state.ui.filter.id:""));
    $("#tTitle").value=t?t.title:"";
    $("#tNotes").value=t?(t.notes||""):"";
    // board fields
    $("#tStatus").value=t&&t.kind==="project"?t.status:"todo";
    $("#tDue").value=t&&t.kind==="project"?(t.due||""):"";
    modalSteps=t&&t.kind==="project"?(t.steps||[]).map(s=>({...s})):[];
    renderStepsEditor();
    // daily fields
    modalDay=t&&t.kind==="daily"?t.day:(preset.scheduledDate?DAYS[dayIndexOfISO(preset.scheduledDate)].k:null);
    if(t&&t.kind==="daily"&&t.scheduledDate) modalDay=DAYS[dayIndexOfISO(t.scheduledDate)].k;
    window.__presetDate = preset.scheduledDate || (t&&t.scheduledDate) || null;
    rebuildDayChips();
    // repeat controls: only on create + daily
    const canRepeat=!t;
    $("#repeatField").style.display=canRepeat?"":"none";
    modalRepeatDays=[]; $("#tRepeat").value="none"; $("#tInterval").value="1"; refreshRepeatUI();
    rebuildRepeatDays();
    // series note + delete buttons
    $("#seriesNote").style.display=(t&&t.templateId)?"":"none";
    $("#tDeleteSeries").style.display=(t&&t.templateId)?"inline-block":"none";
    $("#tDelete").style.display=t?"inline-block":"none";
    taskScrim.classList.add("open");
    setTimeout(()=>$("#tTitle").focus(),30);
  }
  function closeTask(){taskScrim.classList.remove("open");editingId=null;}

  $("#kindSegs").onclick=e=>{const b=e.target.closest(".seg");if(b&&!b.disabled)setKind(b.dataset.kind);};
  $("#tProgram").onchange=e=>fillProjectSelect(e.target.value,"");
  $("#tRepeat").onchange=refreshRepeatUI;
  $("#addStepBtn").onclick=()=>{modalSteps.push({id:uid(),text:"",done:false,scheduledDate:null});renderStepsEditor();
    const inputs=$("#stepsBox").querySelectorAll(".stext");if(inputs.length)inputs[inputs.length-1].focus();};
  $("#tNewProject").onclick=()=>openProject(null,$("#tProgram").value,(newId)=>{ fillProjectSelect($("#tProgram").value,newId); });
  $("#newTaskBtn").onclick=()=>openTask(null);
  $("#tCancel").onclick=closeTask;

  $("#tSave").onclick=()=>{
    const title=$("#tTitle").value.trim(); if(!title){$("#tTitle").focus();return;}
    const programId=$("#tProgram").value; const projectId=$("#tProject").value||null;
    const notes=$("#tNotes").value.trim();
    if(modalKind==="project"){
      const payload={kind:"project",title,notes,programId,projectId,status:$("#tStatus").value,due:$("#tDue").value||null,
        steps:modalSteps.filter(s=>s.text.trim()).map(s=>({id:s.id,text:s.text.trim(),done:!!s.done,scheduledDate:s.scheduledDate||null,carriedFrom:s.carriedFrom||null}))};
      if(editingId){const t=state.tasks.find(x=>x.id===editingId);Object.assign(t,payload);}
      else state.tasks.push(Object.assign({id:uid(),createdAt:Date.now()},payload));
    } else {
      const repeat=$("#tRepeat").value; const canRepeat=!editingId;
      if(canRepeat && (repeat==="weekly"||repeat==="weekday")){
        const days = repeat==="weekday"? DAYS.map(d=>d.k) : modalRepeatDays.slice();
        if(days.length===0){alert("Pick at least one day to repeat on.");return;}
        const interval = repeat==="weekday"?1:Math.max(1,parseInt($("#tInterval").value,10)||1);
        state.tasks.push({id:uid(),kind:"template",isTemplate:true,title,notes,programId,projectId,
          recur:{days,interval},anchorDate:state.ui.weekStart,createdAt:Date.now()});
        ensureRecurring(state.ui.weekStart);
      } else {
        const dayK = modalDay || DAYS[0].k;
        let scheduledDate = window.__presetDate;
        if(!scheduledDate){ const di=DAYS.findIndex(d=>d.k===dayK); scheduledDate=isoDate(addDays(fromISO(state.ui.weekStart),di)); }
        else { const di=DAYS.findIndex(d=>d.k===dayK); scheduledDate=isoDate(addDays(fromISO(state.ui.weekStart),di)); }
        const payload={kind:"daily",title,notes,programId,projectId,day:dayK,scheduledDate,done:false};
        if(editingId){const t=state.tasks.find(x=>x.id===editingId);Object.assign(t,payload);}
        else state.tasks.push(Object.assign({id:uid(),createdAt:Date.now()},payload));
      }
    }
    saveData();render();closeTask();
  };
  $("#tDelete").onclick=()=>{ if(editingId&&confirm("Delete this task?")){state.tasks=state.tasks.filter(x=>x.id!==editingId);saveData();render();closeTask();} };
  $("#tDeleteSeries").onclick=()=>{
    const t=state.tasks.find(x=>x.id===editingId); if(!t||!t.templateId)return;
    if(confirm("Delete the whole repeating series and its occurrences?")){
      const tid=t.templateId;
      state.tasks=state.tasks.filter(x=>x.id!==tid && x.templateId!==tid);
      saveData();render();closeTask();
    }
  };

  /* ---------- project modal ---------- */
  const projScrim=$("#projScrim"); let editingProj=null, projCb=null;
  function openProject(id,programId,cb){
    editingProj=id||null; projCb=cb||null;
    const p=id?projById(id):null;
    $("#projModalTitle").textContent=p?"Edit project":"New project";
    $("#pName").value=p?p.name:"";
    fillProgramSelect($("#pProgram"), p?p.programId:(programId||state.programs[0].id));
    $("#pDelete").style.display=p?"inline-block":"none";
    projScrim.classList.add("open"); setTimeout(()=>$("#pName").focus(),30);
  }
  $("#pCancel").onclick=()=>projScrim.classList.remove("open");
  $("#pSave").onclick=()=>{
    const name=$("#pName").value.trim(); if(!name){$("#pName").focus();return;}
    const programId=$("#pProgram").value;
    let newId;
    if(editingProj){Object.assign(projById(editingProj),{name,programId});newId=editingProj;}
    else{newId=uid();state.projects.push({id:newId,name,programId});}
    saveData();projScrim.classList.remove("open");
    if(projCb)projCb(newId); render();
  };
  $("#pDelete").onclick=()=>{
    if(!editingProj)return;
    const n=state.tasks.filter(t=>t.projectId===editingProj).length;
    if(confirm(n?("Delete this project? Its "+n+" task(s) stay but become unassigned."):"Delete this project?")){
      state.tasks.forEach(t=>{if(t.projectId===editingProj)t.projectId=null;});
      state.projects=state.projects.filter(p=>p.id!==editingProj);
      if(state.ui.filter.type==="project"&&state.ui.filter.id===editingProj)state.ui.filter={type:"all"};
      saveData();projScrim.classList.remove("open");render();
    }
  };

  /* ---------- program modal ---------- */
  const progScrim=$("#progScrim"); let editingProg=null, progColor=SWATCHES[0];
  function buildSwatches(){const w=$("#gSwatches");w.innerHTML="";SWATCHES.forEach(c=>{const b=document.createElement("button");
    b.className="swatch";b.style.background=c;b.setAttribute("aria-pressed",c===progColor?"true":"false");
    b.onclick=()=>{progColor=c;buildSwatches();};w.appendChild(b);});}
  function openProgram(id){
    editingProg=id||null; const p=id?progById(id):null;
    $("#progModalTitle").textContent=p?"Edit program":"New program";
    $("#gName").value=p?p.name:""; progColor=p?p.color:SWATCHES[state.programs.length%SWATCHES.length];
    buildSwatches(); $("#gDelete").style.display=p?"inline-block":"none";
    progScrim.classList.add("open"); setTimeout(()=>$("#gName").focus(),30);
  }
  $("#addProgBtn").onclick=()=>openProgram(null);
  $("#gCancel").onclick=()=>progScrim.classList.remove("open");
  $("#gSave").onclick=()=>{
    const name=$("#gName").value.trim(); if(!name){$("#gName").focus();return;}
    if(editingProg)Object.assign(progById(editingProg),{name,color:progColor});
    else state.programs.push({id:uid(),name,color:progColor});
    saveData();progScrim.classList.remove("open");render();
  };
  $("#gDelete").onclick=()=>{
    if(!editingProg)return;
    if(state.programs.length<=1){alert("Keep at least one program.");return;}
    const other=state.programs.find(p=>p.id!==editingProg).id;
    const n=state.tasks.filter(t=>t.programId===editingProg).length;
    if(confirm(n?("Delete this program? Its projects and "+n+" task(s) move to another program."):"Delete this program?")){
      state.projects.forEach(p=>{if(p.programId===editingProg)p.programId=other;});
      state.tasks.forEach(t=>{if(t.programId===editingProg)t.programId=other;});
      state.programs=state.programs.filter(p=>p.id!==editingProg);
      if(state.ui.filter.type==="program"&&state.ui.filter.id===editingProg)state.ui.filter={type:"all"};
      saveData();progScrim.classList.remove("open");render();
    }
  };

  /* ---------- view toggle + misc ---------- */
  function setView(v){state.ui.view=v;$("#viewBoard").setAttribute("aria-pressed",v==="board");$("#viewWeek").setAttribute("aria-pressed",v==="week");saveData();render();}
  $("#viewBoard").onclick=()=>setView("board");
  $("#viewWeek").onclick=()=>setView("week");
  $("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("show");
  $("#exportBtn").onclick=exportData;
  $("#importBtn").onclick=()=>$("#importFile").click();
  $("#importFile").onchange=e=>{ const f=e.target.files[0]; if(f)importData(f); e.target.value=""; };
  $("#fileNewBtn").onclick=linkNewFile;
  $("#fileOpenBtn").onclick=openExistingFile;
  $("#reconnectBtn").onclick=reconnectFile;
  $("#unlinkBtn").onclick=unlinkFile;
  [taskScrim,projScrim,progScrim].forEach(sc=>sc.onclick=e=>{if(e.target===sc)sc.classList.remove("open");});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeTask();projScrim.classList.remove("open");progScrim.classList.remove("open");}});

  /* ---------- boot ---------- */
  (async function init(){
    let loaded=await loadData();
    if(loaded&&loaded.version<2)loaded=migrate(loaded);
    if(loaded&&loaded.programs){
      state=Object.assign({version:2,programs:[],projects:[],tasks:[],ui:{}},loaded);
      state.ui=Object.assign({view:"board",filter:{type:"all"},sort:"created",weekStart:null,collapsed:{}},loaded.ui||{});
    } else { seed(); }
    state.ui.weekStart=isoDate(mondayOf(new Date()));
    ensureRecurring(state.ui.weekStart);
    rollForward();

    // If a data file was linked before, it is the durable source of truth.
    if(FSA){
      try{
        const handle=await idbGet("handle");
        if(handle){
          rememberedHandle=handle;
          let perm="prompt";
          try{ perm=await handle.queryPermission({mode:"readwrite"}); }catch(e){}
          if(perm==="granted"){
            try{
              const text=await (await handle.getFile()).text();
              let data=JSON.parse(text);
              if(data && data.version<2) data=migrate(data);
              if(data && Array.isArray(data.programs) && Array.isArray(data.tasks)){ adoptState(data); fileHandle=handle; }
              else { pendingHandle=true; }
            }catch(e){ pendingHandle=true; }
          } else { pendingHandle=true; }
        }
      }catch(e){}
    }

    await saveData();
    updateDataUI();
    setView(state.ui.view||"board");
  })();
})();
</script>
